[build-system]
requires = ["maturin>=1.9.3,<2.0"]
build-backend = "maturin"

[project]
name = "puffinparse"
version = "0.1.6"
description = "One API for every OCR / document-parsing provider (Reducto, Extend, LlamaParse, ...). Rust core, Python SDK, open benchmark."
readme = "README.md"
license = "MIT"
# PEP 639: copied into the wheel's .dist-info/licenses/ and into the sdist. The glob also picks up
# THIRD_PARTY_LICENSES.txt (every bundled crate's licence text), which the release workflow generates
# with `scripts/third_party_notices.py --full` before building.
license-files = ["LICENSE", "THIRD_PARTY_*"]
requires-python = ">=3.9"
authors = [{ name = "PuffinParse contributors" }]
keywords = ["ocr", "document-parsing", "pdf", "reducto", "extend", "llamaparse", "benchmark"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Text Processing",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.8", "maturin>=1.9.3"]
bench = ["pillow>=10"]

[project.urls]
Homepage = "https://puffinparse.com"
Documentation = "https://puffinparse.com/docs/"
Repository = "https://github.com/ajinkyashejul/puffinparse"
Issues = "https://github.com/ajinkyashejul/puffinparse/issues"
Changelog = "https://github.com/ajinkyashejul/puffinparse/blob/main/CHANGELOG.md"

[tool.maturin]
manifest-path = "crates/puffinparse-python/Cargo.toml"
python-source = "python"
module-name = "puffinparse._core"
features = ["pyo3/extension-module"]
strip = true

[tool.ruff]
line-length = 110
target-version = "py39"
extend-exclude = ["target"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["UP007", "UP045", "RUF012"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "puffinparse._core"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["python/tests"]
asyncio_mode = "auto"
