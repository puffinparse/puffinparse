name: Pages

# Publishes the whole PuffinParse site to GitHub Pages: the landing page, the docs under
# /docs/ and the benchmark results viewer under /benchmark-results/. This is the same
# build Vercel runs (website/build.py, which invokes benchmark/site/build.py itself), so
# Pages mirrors https://puffinparse.com rather than publishing a different artefact.
#
# SETUP (one time, by a maintainer): in the repository settings open
# Settings -> Pages and set "Source" to "GitHub Actions", then add the repository
# variable PAGES_ENABLED=true (Settings -> Secrets and variables -> Actions -> Variables).
# Until then pushes skip this workflow (configure-pages fails without Pages enabled);
# a manual run still works.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the build job (which pip-installs packages) only reads; Pages write and the
# OIDC token are granted to the deploy job alone.
permissions:
  contents: read

# Only one Pages deployment at a time; let a newer commit finish rather than
# cancelling an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    if: github.event_name == 'workflow_dispatch' || vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages site settings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      # markdown renders the docs; Pillow is optional and only used to render page 1
      # of PDF inputs into a preview PNG for the results viewer.
      - name: Install build dependencies
        run: python -m pip install --upgrade pip markdown pillow pypdfium2

      # A GitHub Pages project site is served from /<repo>/, so links and canonical URLs
      # are built for that prefix. --with-benchmark is on by default, so this one command
      # produces the landing page, /docs/ and /benchmark-results/.
      - name: Build the site (landing + docs + benchmark results viewer)
        run: |
          python website/build.py \
            --out site-dist \
            --base-url "/${{ github.event.repository.name }}" \
            --site-url "${{ steps.pages.outputs.base_url }}" \
            --check

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site-dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
