name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (fmt, clippy, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Live provider tests are `#[ignore]`d and/or skip themselves when
      # REDUCTO_API_KEY / EXTEND_API_KEY / LLAMA_API_KEY are absent, so CI
      # deliberately sets no provider secrets: this run is offline.
      - name: Test
        run: cargo test --workspace

      - name: Build CLI (release)
        run: cargo build -p puffinparse-cli --release

      - name: Upload CLI binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: puffinparse-cli-linux-x86_64
          path: target/release/puffinparse
          if-no-files-found: error
          retention-days: 7

  python:
    name: Python ${{ matrix.python-version }} (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      # maturin develop installs into an active virtualenv, so create one and
      # put it on PATH for every later step in this job.
      - name: Create virtualenv
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install maturin ruff mypy pytest pytest-asyncio

      # Builds crates/puffinparse-python into the venv as `puffinparse._core`,
      # driven by the root pyproject.toml ([tool.maturin] manifest-path).
      - name: Build and install the extension module
        run: maturin develop --release

      - name: Ruff lint
        run: ruff check python/ benchmark/ examples/

      - name: Ruff format check
        run: ruff format --check python/ benchmark/ examples/

      - name: Mypy
        run: mypy python/puffinparse

      # No provider API keys are set here on purpose: the live provider tests
      # skip themselves when REDUCTO_API_KEY / EXTEND_API_KEY / LLAMA_API_KEY
      # are missing.
      - name: Pytest
        run: pytest python/tests -q

  node:
    name: Node.js SDK (build addon, typecheck, node:test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: node-addon

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install JS tooling
        run: npm ci

      # Debug build: the tests exercise the bridge, not optimised code, and it is much faster.
      # CARGO_TARGET_DIR keeps the addon in the workspace target dir that rust-cache restores.
      - name: Build the native addon
        run: npm run build:debug
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target

      - name: Typecheck index.d.ts
        run: npm run typecheck

      # Offline: unit tests plus end-to-end calls against a local mock provider. The live test
      # skips itself because PUFFINPARSE_LIVE_TESTS and provider keys are deliberately not set.
      - name: Test
        run: npm test

  site:
    name: Site (build, link check, agent QA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # markdown renders the docs; openapi-spec-validator lets website/qa.py validate /openapi.json
      # fully. Pillow / pypdfium2 (PDF page previews) are left out: QA does not need them.
      - name: Install build dependencies
        run: python -m pip install markdown openapi-spec-validator

      # The same command Vercel runs, plus --check: every internal link and fragment, JSON-LD on
      # every page, and the generated redirects / routes in vercel.json match nav.json.
      - name: Build the site
        run: python website/build.py --out "$RUNNER_TEMP/site" --site-url https://puffinparse.com --check

      # Offline: Markdown negotiation routes, llms.txt, JSON-LD, robots.txt, /openapi.json (valid,
      # example paths exist, published JSON matches its schemas) and /.well-known/api-catalog.
      - name: Site QA
        run: python website/qa.py "$RUNNER_TEMP/site"

  docker:
    name: Gateway image (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build image
        run: docker build -t puffinparse:ci .
      - name: CLI runs in the image
        run: docker run --rm puffinparse:ci --version
      - name: Gateway serves /health and /v1/models
        run: |
          printf '[server]\nport = 4000\n' > "$RUNNER_TEMP/puffinparse.toml"
          docker run -d --name gw -p 4000:4000 \
            -v "$RUNNER_TEMP/puffinparse.toml:/etc/puffinparse/puffinparse.toml:ro" puffinparse:ci
          for i in $(seq 1 30); do curl -fsS localhost:4000/health && break; sleep 1; done
          curl -fsS localhost:4000/v1/models | head -c 300; echo
          docker logs gw
          docker rm -f gw
