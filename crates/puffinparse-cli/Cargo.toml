[package]
name = "puffinparse-cli"
description = "PuffinParse command-line: parse documents with any OCR provider and run the open benchmark."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[[bin]]
name = "puffinparse"
path = "src/main.rs"

[dependencies]
puffinparse-core = { workspace = true }
puffinparse-server = { path = "../puffinparse-server", version = "0.1.6" }
# `io-std` + `io-util`: `puffinparse mcp` speaks JSON-RPC over stdin / stdout.
tokio = { workspace = true, features = ["io-std", "io-util"] }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
comfy-table = { workspace = true }
indicatif = { workspace = true }
futures = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.11"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
# Loopback mock of a provider API for the MCP tests (already built for puffinparse-server).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
