[package]
name = "puffinparse-core"
description = "One API for every OCR / document-parsing provider. Rust core of PuffinParse."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
reqwest = { workspace = true }
# `process` + `io-util`: the Tesseract provider shells out to `tesseract` / `pdftoppm`.
# `net`: `fetch.rs` resolves document-URL hosts itself to refuse private addresses.
tokio = { workspace = true, features = ["process", "io-util", "net"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
mime_guess = { workspace = true }
url = { workspace = true }
strsim = { workspace = true }
unicode-normalization = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.10"
# AWS SigV4 request signing (providers/textract.rs). Deliberately not the aws-sdk-* crates:
# SigV4 for a single fixed-shape POST is ~60 lines of HMAC-SHA256.
hmac = "0.13"
sha2 = "0.11"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[lints.rust]
unsafe_code = "forbid"
